name: Calendario de eventos
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1,4"
permissions:
  contents: write
jobs:
  calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Armar calendario
        run: python scripts/calendario_datos.py
      - name: Guardar resultados
        run: |
          git config user.name "radiAr bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos/calendario_eventos.json
          git commit -m "Actualizar calendario" || echo "sin cambios"
          git pull --rebase
          git push
