name: Lluvia en vivo

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-push
  cancel-in-progress: false

jobs:
  lluvia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lluvia por ciudad (MET Norway)
        run: python lluvia.py
      - name: Guardar
        run: |
          git config user.name "radiAr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos/lluvia.json
          git diff --cached --quiet && exit 0
          git commit -m "Lluvia en vivo"
          git pull --rebase
          git push
